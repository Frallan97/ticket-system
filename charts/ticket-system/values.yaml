replicaCount: 1

backend:
  image:
    repository: ghcr.io/frallan97/ticket-system-backend
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  env:
    PORT: "8080"
    ENVIRONMENT: "production"
    DEBUG: "false"
    AUTH_SERVICE_URL: "http://auth-service-backend.auth-service.svc.cluster.local:8080"
    JWT_PUBLIC_KEY_URL: "http://auth-service-backend.auth-service.svc.cluster.local:8080/api/public-key"
    ALLOWED_ORIGINS: "https://ticket.vibeoholic.com"
    CASBIN_MODEL_PATH: "./config/casbin_model.conf"
    MINIO_ENDPOINT: "minio:9000"
    MINIO_USE_SSL: "false"
    MINIO_BUCKET: "event-images"

postgres:
  enabled: true
  image: postgres:15-alpine

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  persistence:
    enabled: true
    size: 10Gi
    storageClass: "local-path"

  env:
    POSTGRES_DB: "ticketdb"
    POSTGRES_USER: "ticketuser"
    POSTGRES_PASSWORD: "changeme-in-production"

minio:
  enabled: true
  image: minio/minio:latest

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  persistence:
    enabled: true
    size: 20Gi
    storageClass: "local-path"

  env:
    MINIO_ROOT_USER: "minioadmin"
    MINIO_ROOT_PASSWORD: "changeme-in-production"

service:
  type: ClusterIP
  backend:
    port: 8080
  postgres:
    port: 5432
  minio:
    apiPort: 9000
    consolePort: 9001

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ticket.vibeoholic.com
  tls:
    enabled: true
    secretName: ticket-system-tls

imagePullSecrets:
  - name: ghcr-pull-secret

namespace: ticket-system
