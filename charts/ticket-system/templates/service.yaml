---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
    app.kubernetes.io/name: ticket-system
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.frontend.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    app.kubernetes.io/name: ticket-system
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.backend.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: backend

{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    app.kubernetes.io/name: ticket-system
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.service.postgres.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app: postgres
{{- end }}

{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app: minio
    app.kubernetes.io/name: ticket-system
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.service.minio.apiPort }}
    targetPort: api
    protocol: TCP
    name: api
  - port: {{ .Values.service.minio.consolePort }}
    targetPort: console
    protocol: TCP
    name: console
  selector:
    app: minio
{{- end }}
