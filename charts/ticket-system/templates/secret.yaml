# NOTE: This is a template for the secrets needed by ticket-system
# In production, create these secrets manually or use a secret management solution
# like Sealed Secrets, External Secrets Operator, or Vault
#
# To create manually:
# kubectl create secret generic ticket-system-secrets \
#   --namespace=ticket-system \
#   --from-literal=postgres-user=ticketuser \
#   --from-literal=postgres-password=YOUR_SECURE_PASSWORD \
#   --from-literal=database-url=postgresql://ticketuser:YOUR_SECURE_PASSWORD@postgres:5432/ticketdb?sslmode=disable \
#   --from-literal=minio-access-key=YOUR_MINIO_ACCESS_KEY \
#   --from-literal=minio-secret-key=YOUR_MINIO_SECRET_KEY

apiVersion: v1
kind: Secret
metadata:
  name: ticket-system-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ticket-system
type: Opaque
stringData:
  postgres-user: {{ .Values.postgres.env.POSTGRES_USER | quote }}
  postgres-password: {{ .Values.postgres.env.POSTGRES_PASSWORD | quote }}
  database-url: "postgresql://{{ .Values.postgres.env.POSTGRES_USER }}:{{ .Values.postgres.env.POSTGRES_PASSWORD }}@postgres:5432/{{ .Values.postgres.env.POSTGRES_DB }}?sslmode=disable"
  minio-access-key: {{ .Values.minio.env.MINIO_ROOT_USER | quote }}
  minio-secret-key: {{ .Values.minio.env.MINIO_ROOT_PASSWORD | quote }}
